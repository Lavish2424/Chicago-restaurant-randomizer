name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours (UTC); Streamlit sleeps after ~12h idle
  workflow_dispatch:         # lets you run it manually from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app (wake it if asleep)
        env:
          APP_URL: https://ajrandom.streamlit.app/
        run: |
          python - <<'EOF'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(8000)

              # If the app is hibernating, click the wake-up button
              wake = page.get_by_role(
                  "button", name=re.compile("get this app back up", re.I)
              )
              if wake.count() > 0:
                  print("App was asleep - clicking wake button")
                  wake.first.click()
                  page.wait_for_timeout(45000)  # give it time to boot
              else:
                  print("App already awake")

              # Stay on the page a bit so the session registers as a real visit
              page.wait_for_timeout(20000)
              print("Done. Page title:", page.title())
              browser.close()
          EOF
